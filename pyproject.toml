[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanovna-calibration"
version = "0.1.0"
description = "Reproducible NanoVNA calibration and RF measurement analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Telmo Miguel-Medina" }]
dependencies = [
    "numpy>=1.24",
    "scikit-rf>=1.0",
    "rfmeasurement>=0.1.0",
]

[project.optional-dependencies]
instrument = ["pynanovna>=1.0", "pyserial>=3.5"]
notebook = ["jupyter", "ipykernel", "matplotlib", "pandas"]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/telmomm/nanovna-calibration"
Issues = "https://github.com/telmomm/nanovna-calibration/issues"
Changelog = "https://github.com/telmomm/nanovna-calibration/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nanovna_calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
